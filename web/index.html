<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>examshell</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #topbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.9rem;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    color: #c9d1d9;
    font-size: 0.85rem;
  }
  #topbar .title {
    font-weight: 600;
    color: #58a6ff;
  }
  #dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #f85149;
    display: inline-block;
    transition: background 0.2s;
  }
  #dot.connected { background: #3fb950; }
  #term-wrap {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px;
    box-sizing: border-box;
  }
  #terminal { height: 100%; }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">examshell</span>
    <span id="dot"></span>
    <span id="status">connexion...</span>
  </div>
  <div id="term-wrap"><div id="terminal"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: "Menlo, Consolas, 'DejaVu Sans Mono', monospace",
      theme: {
        background: "#0d1117",
        foreground: "#c9d1d9",
        cursor: "#58a6ff",
      },
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById("terminal"));
    fitAddon.fit();

    const dot = document.getElementById("dot");
    const status = document.getElementById("status");

    const wsPort = "__WS_PORT__";
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProtocol}//${location.hostname}:${wsPort}`;

    function connect() {
      const socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        dot.classList.add("connected");
        status.textContent = "connecté";
        sendResize(socket);
      };

      socket.onmessage = (event) => {
        term.write(event.data);
      };

      socket.onclose = () => {
        dot.classList.remove("connected");
        status.textContent = "déconnecté — nouvelle tentative dans 2s";
        setTimeout(connect, 2000);
      };

      socket.onerror = () => socket.close();

      term.onData((data) => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "input", data }));
        }
      });

      function sendResize(s) {
        if (s.readyState === WebSocket.OPEN) {
          s.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      }

      window.addEventListener("resize", () => {
        fitAddon.fit();
        sendResize(socket);
      });
    }

    connect();
  </script>
</body>
</html>
