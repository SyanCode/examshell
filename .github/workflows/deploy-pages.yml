name: Deploy examshell to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "data/**"
      - "scripts/build_web_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bundle exercises/solutions for the web app
        run: python3 scripts/build_web_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pages/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
